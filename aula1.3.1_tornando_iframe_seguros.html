<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframes</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            padding: 20px;
        }

        iframe {
            border: 2px solid #ccc;
            border-radius: 8px;
        }

        /* Container para manter a proporção */
        .iframe-container {
            position: relative;
            width: 100%;
            overflow: hidden;
            padding-top: 56.25%;
            /* Proporção 16:9 */
        }

        .iframe-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>
    <h1>Tornando o Iframe Seguro</h1>
    <a href="#" onclick="clicou()">Clique em mim.</a>
<div id="saida"></div>
    <script>
        function clicou(){
            s = window.document.getElementById("saida");
            s.innerHTML += '<p>Você clicou em mim.</p>'
        }
    </script>
</body>

</html>
